name: validate-pr
on:
  pull_request:
    types: [edited, opened, reopened, synchronize]

defaults:
  run:
    shell: bash

jobs:
  validate_pr_title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        if: github.base_ref == 'dev'
        run: |
          title="${{ github.event.pull_request.title }}"
          if [[ "$title" =~ ^(POSTRELEASE|FIX|CHANGE|NEW)([[:space:]]*\([^()]+\))?[[:space:]]*:?[[:space:]]*@W-[[:digit:]]{8,9}@[[:space:]]*.+ ]]; then
              echo "Valid PR title: '$title'"
          else
              echo "::error::Invalid PR title: '$title'. Please following the format: POSTRELEASE|FIX|CHANGE|NEW (__) @W-XXXXXXXX@ Summary"
              exit 1
          fi
  check_for_postrelease_keyword:
    runs-on: macos-latest
    outputs:
      is-postrelease: ${{ steps.main.outputs.is_postrelease }}
    steps:
      - name: Check for "Postrelease" keyword in PR title.
        id: main
        if: github.base_ref == 'dev'
        run: |
          title="${{ github.event.pull_request.title }}"
          if [[ "$title" =~ ^POSTRELEASE ]]; then
            echo "is_postrelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_postrelease=false" >> "$GITHUB_OUTPUT"
          fi
  validate_packages:
    runs-on: macos-latest
    needs: check_for_postrelease_keyword
    steps:
      - name: Support long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Validate that changed packages are versioned as snapshots
        if: ${{ needs.check_for_postrelease_keyword.outputs.is-postrelease == 'false' }}
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          CHANGED_FILES=`git diff --name-only $HEAD_SHA $BASE_SHA`
          node ./.github/workflows/verify-pr/validate-changed-package-versions.js "$CHANGED_FILES"
      - name: Validate that packages properly depend on each other
        if: ${{ needs.check_for_postrelease_keyword.outputs.is-postrelease == 'false' }}
        run: |
          cd packages
          PACKAGE_NAMES=`ls`
          cd ..
          node ./.github/workflows/verify-pr/validate-package-interdependencies.js "$PACKAGE_NAMES"
  run_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Support long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: npm install
      - run: npm run all
  run_experiment_2:
    runs-on: macos-latest
    steps:
      - name: eval thing
        run: |
          echo 'JFB=beep;echo $JFB' > myscript.txt
          JFS=`cat myscript.txt`
          echo script is $JFS
          eval $JFS
  run_experiment_3:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: create experimental branch
        run: |
          NOW_TIMESTAMP=$(date +%s)
          git checkout -b experiment_2/$NOW_TIMESTAMP
          git push --set-upstream origin experiment_2/$NOW_TIMESTAMP
          echo "branch_name=experiment_2/$NOW_TIMESTAMP" >> "$GITHUB_OUTPUT"
      - name: update version dependencies
        run: |
          PACKAGES_TO_UPDATE="code-analyzer-core code-analyzer-engine-api code-analyzer-eslint-engine code-analyzer-flow-engine"
          node ./.github/workflows/publish-package-to-npm/update-versions-in-released-packages.js "${PACKAGES_TO_UPDATE}"
      - name: build packages
        run: |
          npm install
          npm run build
      - name: build commit script
        run: |
          cd packages
          ALL_PACKAGES=`ls`
          cd ..
          node ./.github/workflows/publish-package-to-npm/update-dependencies-on-released-packages.js "${PACKAGES_TO_UPDATE}"
          cd .github/workflows/publish-package-to-npm
          npm install
          node graphql-script.js "$ALL_PACKAGES"
  run_experiment:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: support long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: create experimental branch
        shell: zsh {0}
        run: |
          NOW_TIMESTAMP=$(date +%s)
          git checkout -b experiment-1/$NOW_TIMESTAMP
          git push --set-upstream origin experiment_1/$NOW_TIMESTAMP
          echo "branch_name=experiment_1/$NOW_TIMESTAMP" >> "$GITHUB_OUTPUT"
          PACKAGES_TO_UPDATE="code-analyzer-core code-analyzer-engine-api code-analyzer-eslint-engine code-analyzer-flow-engine"
          node ./.github/workflows/publish-package-to-npm/update-versions-in-released-packages.js "${PACKAGES_TO_UPDATE}"
          cd packages
          ALL_PACKAGES=`ls`
          cd ..
          node ./.github/workflows/publish-package-to-npm/update-dependencies-on-released-packages.js "$PACKAGES_TO_UPDATE" "$ALL_PACKAGES"
          npm install
          npm run build
          node ./.github/workflows/publish-package-to-npm/create-branch-commit-script.js "$ALL_PACKAGES"

          SCRIPT=`cat graphQlScript.txt`
          eval $SCRIPT

